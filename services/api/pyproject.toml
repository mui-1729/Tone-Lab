[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "tone-lab-api"
version = "0.1.0"
description = "Audio comparison API for Tone Lab"
requires-python = ">=3.12"
dependencies = [
  "fastapi==0.136.2",
  "uvicorn[standard]>=0.34,<1",
  "python-multipart>=0.0.20,<1",
  "librosa==0.11.0",
  "numpy>=2.0,<3",
  "soundfile>=0.13,<1",
]

[project.optional-dependencies]
dev = [
  "httpx>=0.28,<1",
  "pytest>=8,<9",
]

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
